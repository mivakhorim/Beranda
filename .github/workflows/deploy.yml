name: Universal Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Diperbarui ke versi 24 untuk mengatasi warning deprecation
          # Baris cache: 'npm' Dihapus agar tidak error saat package-lock.json tidak ditemukan

      - name: Install dependencies
        run: npm install

      - name: Ensure required files exist
        run: |
          # Membuat folder src jika belum ada
          mkdir -p src
          
          # Jika input.css tidak ada, otomatis buatkan versi defaultnya
          if [ ! -f ./src/input.css ]; then
            echo "File ./src/input.css tidak ditemukan! Mendownload/Membuat file default..."
            echo "@tailwind base;" > ./src/input.css
            echo "@tailwind components;" >> ./src/input.css
            echo "@tailwind utilities;" >> ./src/input.css
          fi

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4