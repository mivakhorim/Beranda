<!-- BORDERLESS CLEAN FLOATING ROBOT ASSISTANT -->
  <div id="peeking-robot-dock" class="fixed right-3 sm:right-6 bottom-20 sm:bottom-24 z-50 select-none pointer-events-auto" data-state="peek">
    <button onclick="openConsultationModal()" id="robot-peek-btn" aria-label="Konsultasi Robot Asisten" title="Klik untuk konsultasi cepat" class="p-0 bg-transparent border-none outline-none focus:outline-none cursor-pointer flex items-center justify-center group transition-transform hover:scale-110 active:scale-95">
      <div class="relative w-14 h-12 sm:w-16 sm:h-14 flex items-center justify-center filter drop-shadow-[0_8px_18px_rgba(0,210,255,0.55)]">

  <defs>
    <radialGradient id="helmetShellGrad" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f1f5f9"/>
      <stop offset="85%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
    <linearGradient id="thrusterPodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="cyanBezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="screenGlassGrad" cx="50%" cy="30%" r="70%">

      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="crtScanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.45"/>
      <line x1="0" y1="2" x2="100" y2="2" stroke="#00f0ff" stroke-width="2" opacity="0.95"/>
    </pattern>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur1"/>
      <feGaussianBlur stdDeviation="7" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

          <label class="block font-bold text-slate-700 dark:text-slate-300 mb-1">
            Pilih Layanan yang Diinginkan:
          </label>
          
                    <select id="consult-service-select" name="serviceType" onfocus="handleDropdownFocus()" onblur="handleDropdownBlur()" onchange="handleDropdownChange(this)" class="w-full px-2.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs font-semibold text-slate-800 dark:text-slate-200 focus:ring-2 focus:ring-cyan-500 focus:outline-none transition-all cursor-pointer">
            <optgroup label="Layanan Jasa &amp; Arsitektur">
              <option value="Jasa Optimasi Laptop &amp; PC Remote">💻 Optimasi Laptop/PC</option>
              <option value="3D Modeling Bangunan &amp; Render">🏢 3D Model &amp; Render</option>
              <option value="Gambar Kerja &amp; PBG Bangunan">📐 Gambar Kerja PBG</option>
              <option value="Peta Format SHP &amp; Validasi OSS">🗺️ Peta SHP OSS</option>
              <option value="Penerbitan NIB Usaha OSS RBA">📜 NIB Usaha OSS</option>
              <option value="Pembuatan Web Serverless &amp; Profil UMKM">🌐 Web Profil UMKM</option>
            </optgroup>
            <optgroup label="Produk Digital &amp; Kasir">
              <option value="Aplikasi Kasir POS Google Sheets">📦 Kasir POS Sheets</option>
              <option value="Paket Desain Rumah 2D/3D Lengkap">🏠 Desain Rumah 2D/3D</option>
              <option value="Template Website Modern Siap Pakai">💻 Template Website</option>
              <option value="E-Book Google Apps Script Master">📘 E-Book Script Master</option>
              <option value="PaySheet QRIS Payment Engine">⚡ PaySheet QRIS Engine</option>
            </optgroup>
            <optgroup label="Pertanyaan Lain">
              <option value="Konsultasi Kustom / Tanya Fitur Gratis">🛠️ Konsultasi Kustom</option>
            </optgroup>
          </select>

        <div>
          <label class="block font-bold text-slate-700 dark:text-slate-300 mb-1">Nama Lengkap / Usaha: *</label>
          <input type="text" name="clientName" placeholder="Nama Anda atau Nama Usaha" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs text-slate-800 dark:text-slate-200 focus:ring-1 focus:ring-blue-500 focus:outline-none" required />
        </div>

        <div>
          <label class="block font-bold text-slate-700 dark:text-slate-300 mb-1">No. WhatsApp Aktif: *</label>
          <input type="tel" name="clientWhatsapp" placeholder="081234567890" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs text-slate-800 dark:text-slate-200 focus:ring-1 focus:ring-blue-500 focus:outline-none" required />
        </div>

        <div>
          <label class="block font-bold text-slate-700 dark:text-slate-300 mb-1">Email Anda (Untuk Salinan Resume):</label>
          <input type="email" name="clientEmail" placeholder="emailanda@gmail.com" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs text-slate-800 dark:text-slate-200 focus:ring-1 focus:ring-blue-500 focus:outline-none" />
        </div>

        <div>
          <label class="block font-bold text-slate-700 dark:text-slate-300 mb-1">Ceritakan Rencana / Kebutuhan Proyek Anda: *</label>
          <textarea name="projectDetails" rows="3" placeholder="Jelaskan kebutuhan, tenggat waktu, atau pertanyaan yang ingin Anda konsultasikan..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs text-slate-800 dark:text-slate-200 focus:ring-1 focus:ring-blue-500 focus:outline-none" required></textarea>
        </div>

        <button type="submit" class="w-full py-3.5 sm:py-4 bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-extrabold text-xs sm:text-sm rounded-2xl shadow-xl shadow-indigo-500/25 hover:shadow-indigo-500/40 hover:scale-[1.01] active:scale-[0.98] transition-all duration-300 flex items-center justify-center gap-2 cursor-pointer">
