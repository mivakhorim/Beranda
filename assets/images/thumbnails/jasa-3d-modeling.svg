<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <rect width="400" height="240" rx="20" fill="#0f172a"/>
  <circle cx="200" cy="120" r="90" fill="#8b5cf6" opacity="0.15" filter="blur(30px)"/>
  <!-- Isometric 3D House -->
  <!-- Left Wall -->
  <polygon points="140,110 200,145 200,195 140,160" fill="#475569" stroke="#8b5cf6" stroke-width="2"/>
  <!-- Right Wall -->
  <polygon points="200,145 260,110 260,160 200,195" fill="#334155" stroke="#8b5cf6" stroke-width="2"/>
  <!-- Roof Left -->
  <polygon points="140,110 200,75 200,145" fill="#6366f1" stroke="#a78bfa" stroke-width="2"/>
  <!-- Roof Right -->
  <polygon points="200,75 260,110 200,145" fill="#4f46e5" stroke="#a78bfa" stroke-width="2"/>
  <!-- Modern Window Left (Cyan Glow) -->
  <polygon points="155,130 185,148 185,168 155,150" fill="#06b6d4" opacity="0.8"/>
  <!-- Modern Door Right -->
  <polygon points="215,154 235,142 235,180 215,190" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- 3D Axes Indicator -->
  <g transform="translate(70, 60)">
    <line x1="20" y1="40" x2="20" y2="10" stroke="#ef4444" stroke-width="2"/>
    <line x1="20" y1="40" x2="50" y2="50" stroke="#22c55e" stroke-width="2"/>
    <line x1="20" y1="40" x2="0" y2="55" stroke="#3b82f6" stroke-width="2"/>
    <text x="22" y="10" fill="#ef4444" font-size="10" font-weight="bold">Z</text>
    <text x="52" y="52" fill="#22c55e" font-size="10" font-weight="bold">X</text>
    <text x="-10" y="60" fill="#3b82f6" font-size="10" font-weight="bold">Y</text>
  </g>
</svg>