<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <rect width="400" height="240" rx="20" fill="#0f172a"/>
  <circle cx="200" cy="120" r="90" fill="#d97706" opacity="0.15" filter="blur(30px)"/>
  <!-- Official Certificate Document -->
  <rect x="120" y="45" width="160" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Certificate Header Stripe -->
  <rect x="135" y="60" width="130" height="12" rx="3" fill="#1e293b"/>
  <!-- Body text lines -->
  <rect x="135" y="80" width="100" height="6" rx="2" fill="#cbd5e1"/>
  <rect x="135" y="92" width="120" height="6" rx="2" fill="#e2e8f0"/>
  <rect x="135" y="104" width="80" height="6" rx="2" fill="#e2e8f0"/>
  <rect x="135" y="116" width="110" height="6" rx="2" fill="#e2e8f0"/>
  <!-- QR Barcode on Document -->
  <rect x="135" y="135" width="40" height="40" rx="4" fill="#0f172a"/>
  <rect x="140" y="140" width="12" height="12" fill="#ffffff"/>
  <rect x="158" y="140" width="12" height="12" fill="#ffffff"/>
  <rect x="140" y="158" width="12" height="12" fill="#ffffff"/>
  <rect x="160" y="160" width="8" height="8" fill="#ffffff"/>
  <!-- Golden Seal Ribbon -->
  <g transform="translate(225, 135)">
    <circle cx="20" cy="20" r="18" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
    <polygon points="12,34 16,50 20,44 24,50 28,34" fill="#d97706"/>
    <path d="M14 20 L18 24 L26 16" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>