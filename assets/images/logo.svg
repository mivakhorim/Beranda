<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="30%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(15, 15)">
    <!-- Hexagon Outer Shape -->
    <path d="M45,5 L80,25 L80,65 L45,85 L10,65 L10,25 Z" fill="url(#primaryGrad)" rx="8" />
    <!-- Inner Modern Geometric 'D' & Digital Circuit Core -->
    <path d="M30,22 L52,22 C64,22 70,30 70,45 C70,60 64,68 52,68 L30,68 Z" fill="#ffffff" opacity="0.95" />
    <path d="M40,34 L50,34 C56,34 60,38 60,45 C60,52 56,56 50,56 L40,56 Z" fill="url(#primaryGrad)" />
    <!-- Dynamic Tech Dot / Pulse -->
    <circle cx="75" cy="25" r="7" fill="#10b981" filter="url(#glow)" />
    <circle cx="75" cy="25" r="3.5" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <text x="115" y="62" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="900" font-size="42" letter-spacing="-0.5" fill="#0f172a">
    DUTA<tspan fill="url(#primaryGrad)">MIK</tspan><tspan font-size="28" font-weight="700" fill="#0284c7">.ID</tspan>
  </text>
  <text x="117" y="85" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" letter-spacing="3" fill="#64748b">
    DIGITAL SERVICE &amp; CREATIVE HUB
  </text>
</svg>
