<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="100%" height="100%" class="w-full h-full drop-shadow-2xl select-none" fill="none" style="max-height: 110px; max-width: 130px;">
  <defs>
    <!-- White Glossy Outer Helmet Shell Gradient -->
    <radialGradient id="helmetShellGrad" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f1f5f9"/>
      <stop offset="85%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>

    <!-- Ear Thruster Pods Gradient -->
    <linearGradient id="thrusterPodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Cyan Bezel Ring Gradient -->
    <linearGradient id="cyanBezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Dark Visor Screen Gradient -->
    <radialGradient id="screenGlassGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="90%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Cyan Digital Striped Glow Gradient -->
    <linearGradient id="cyanStripeGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- High-Tech CRT Scanlines Pattern for Eyes and Smile -->
    <pattern id="crtScanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.45"/>
      <line x1="0" y1="2" x2="100" y2="2" stroke="#00f0ff" stroke-width="2" opacity="0.95"/>
    </pattern>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur1"/>
      <feGaussianBlur stdDeviation="7" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g class="robot-flight-idle">
    
    <!-- 1. Bottom Ion Jet Thruster Flight Glow -->
    <ellipse cx="120" cy="180" rx="36" ry="10" fill="url(#cyanStripeGlow)" opacity="0.6" filter="url(#neonGlow)" class="robot-thruster-glow"/>
    <ellipse cx="120" cy="180" rx="18" ry="5" fill="#ffffff" opacity="0.9"/>

    <!-- 2. Left Ear Thruster Pod (Side Drone Turbine) -->
    <g transform="translate(8, 62)">
      <rect x="0" y="0" width="34" height="66" rx="17" fill="url(#thrusterPodGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="18" y="10" width="10" height="46" rx="5" fill="url(#cyanBezelGrad)"/>
      <ellipse cx="10" cy="33" rx="5" ry="14" fill="#0f172a"/>
      <ellipse cx="10" cy="33" rx="2.5" ry="8" fill="#00f0ff" filter="url(#neonGlow)" class="robot-thruster-glow"/>
    </g>

    <!-- 3. Right Ear Thruster Pod (Side Drone Turbine) -->
    <g transform="translate(198, 62)">
      <rect x="0" y="0" width="34" height="66" rx="17" fill="url(#thrusterPodGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="6" y="10" width="10" height="46" rx="5" fill="url(#cyanBezelGrad)"/>
      <ellipse cx="24" cy="33" rx="5" ry="14" fill="#0f172a"/>
      <ellipse cx="24" cy="33" rx="2.5" ry="8" fill="#00f0ff" filter="url(#neonGlow)" class="robot-thruster-glow"/>
    </g>

    <!-- 4. Main White Glossy Head Helmet Shell -->
    <rect x="36" y="18" width="168" height="154" rx="66" fill="url(#helmetShellGrad)" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Helmet Top Antennas / Ridge Bump Details -->
    <path d="M84 18 C84 12, 94 12, 94 18 Z" fill="#94a3b8" stroke="#cbd5e1"/>
    <path d="M146 18 C146 12, 156 12, 156 18 Z" fill="#94a3b8" stroke="#cbd5e1"/>

    <!-- Helmet Top Gloss Shine Highlight -->
    <ellipse cx="120" cy="32" rx="48" ry="8" fill="#ffffff" opacity="0.85"/>

    <!-- 5. Cyan Outer Rubberized Bezel Frame Ring -->
    <rect x="48" y="32" width="144" height="126" rx="52" fill="none" stroke="url(#cyanBezelGrad)" stroke-width="8" filter="drop-shadow(0 2px 6px rgba(0,210,255,0.4))"/>

    <!-- 6. Dark Curved CRT Visor Screen -->
    <rect x="52" y="36" width="136" height="118" rx="46" fill="url(#screenGlassGrad)"/>
    <rect x="52" y="36" width="136" height="118" rx="46" fill="url(#crtScanlines)" opacity="0.35"/>

    <!-- 7. Screen Curved Glass Glare Highlight (Top Left) -->
    <path d="M58 56 Q120 38 182 56 Q160 42 120 42 Q78 42 58 56 Z" fill="#ffffff" opacity="0.3"/>
    <ellipse cx="76" cy="56" rx="14" ry="5" fill="#ffffff" opacity="0.45" transform="rotate(-15 76 56)"/>

    <!-- 8. Interactive Cyan Striped LED Eyes (Striped Digital Pill Capsule Eyes) -->
    <g class="robot-led-eyes" filter="url(#neonGlow)">
      
      <!-- Left Pill Capsule Eye -->
      <g>
        <rect x="80" y="62" width="26" height="50" rx="13" fill="url(#cyanStripeGlow)"/>
        <rect x="80" y="62" width="26" height="50" rx="13" fill="url(#crtScanlines)"/>
        <!-- Inner Core Highlight -->
        <ellipse cx="93" cy="74" rx="4" ry="3" fill="#ffffff" opacity="0.9"/>
      </g>

      <!-- Right Pill Capsule Eye -->
      <g>
        <rect x="134" y="62" width="26" height="50" rx="13" fill="url(#cyanStripeGlow)"/>
        <rect x="134" y="62" width="26" height="50" rx="13" fill="url(#crtScanlines)"/>
        <!-- Inner Core Highlight -->
        <ellipse cx="147" cy="74" rx="4" ry="3" fill="#ffffff" opacity="0.9"/>
      </g>

    </g>

    <!-- 9. Cheerful Glowing Cyan Striped LED Smile -->
    <g filter="url(#neonGlow)">
      <path d="M96 126 Q120 144 144 126 Q138 140 120 140 Q102 140 96 126 Z" fill="url(#cyanStripeGlow)"/>
      <path d="M96 126 Q120 144 144 126 Q138 140 120 140 Q102 140 96 126 Z" fill="url(#crtScanlines)"/>
      <path d="M97 126 Q120 142 143 126" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
    </g>

  </g>
</svg>