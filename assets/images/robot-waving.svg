<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" class="w-full h-full drop-shadow-2xl select-none" fill="none">
  <defs>
    <!-- Head & Body Gradients -->
    <radialGradient id="headGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
    <radialGradient id="visorGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="80%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="jointGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Animated Floating Group -->
  <g class="robot-float-anim">
    
    <!-- SHADOW ON SURFACE -->
    <ellipse cx="100" cy="232" rx="42" ry="6" fill="#000000" opacity="0.25" />

    <!-- FEET / SHOES -->
    <!-- Left Foot -->
    <ellipse cx="78" cy="226" rx="16" ry="7" fill="#1e293b"/>
    <ellipse cx="78" cy="224" rx="14" ry="5" fill="#334155"/>
    <!-- Right Foot -->
    <ellipse cx="122" cy="226" rx="16" ry="7" fill="#1e293b"/>
    <ellipse cx="122" cy="224" rx="14" ry="5" fill="#334155"/>

    <!-- LEGS -->
    <!-- Left Leg -->
    <path d="M70 178 Q66 200 70 220 L86 220 Q88 200 84 178 Z" fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Right Leg -->
    <path d="M116 178 Q112 200 114 220 L130 220 Q134 200 130 178 Z" fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- HIP / PELVIS -->
    <path d="M68 160 Q100 182 132 160 Q122 178 100 180 Q78 178 68 160 Z" fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- WAIST JOINT (Ribbed black accordion) -->
    <ellipse cx="100" cy="154" rx="16" ry="5" fill="url(#jointGrad)"/>
    <ellipse cx="100" cy="148" rx="17" ry="5" fill="url(#jointGrad)"/>
    <ellipse cx="100" cy="142" rx="18" ry="5" fill="url(#jointGrad)"/>

    <!-- RIGHT ARM (Hanging relaxed by side) -->
    <g>
      <!-- Shoulder Joint -->
      <circle cx="56" cy="116" r="7" fill="url(#jointGrad)"/>
      <ellipse cx="53" cy="125" rx="5" ry="3" fill="url(#jointGrad)"/>
      <ellipse cx="50" cy="131" rx="5" ry="3" fill="url(#jointGrad)"/>
      <!-- Forearm -->
      <path d="M44 136 Q38 162 42 182 Q50 184 54 180 Q52 160 52 136 Z" fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="1.2"/>
      <!-- Hand / Fingers -->
      <ellipse cx="45" cy="186" rx="5" ry="6" fill="#1e293b"/>
      <path d="M42 186 L38 200 L44 200 Z" fill="#0f172a"/>
      <path d="M46 186 L44 202 L49 202 Z" fill="#0f172a"/>
      <path d="M50 186 L51 198 L55 197 Z" fill="#0f172a"/>
    </g>

    <!-- BODY CHEST TORSO -->
    <path d="M64 100 Q100 90 136 100 Q142 144 100 148 Q58 144 64 100 Z" fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Chest Plate Highlight -->
    <path d="M72 104 Q100 96 128 104 Q132 136 100 138 Q68 136 72 104 Z" fill="#ffffff" opacity="0.6"/>

    <!-- NECK JOINT -->
    <ellipse cx="100" cy="94" rx="12" ry="4" fill="url(#jointGrad)"/>

    <!-- LEFT ARM & WAVING HAND (Animated Arm Group) -->
    <g class="robot-waving-arm" style="transform-origin: 145px 105px;">
      <!-- Shoulder Joint -->
      <circle cx="145" cy="105" r="8" fill="url(#jointGrad)"/>
      <!-- Bicep Accordion Joints -->
      <ellipse cx="152" cy="98" rx="6" ry="4" fill="url(#jointGrad)" transform="rotate(-30 152 98)"/>
      <ellipse cx="158" cy="90" rx="6" ry="4" fill="url(#jointGrad)" transform="rotate(-35 158 90)"/>
      <!-- Raised Forearm -->
      <path d="M156 86 Q168 60 174 46 Q184 50 180 62 Q172 78 166 90 Z" fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="1.2"/>
      
      <!-- Open Hand & Fingers -->
      <!-- Palm Base with Glowing Repulsor Disc -->
      <circle cx="180" cy="42" r="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <circle cx="180" cy="42" r="7" fill="url(#cyanGlow)" filter="url(#glow)"/>
      <circle cx="180" cy="42" r="3.5" fill="#ffffff"/>

      <!-- Thumb -->
      <path d="M168 46 Q160 48 158 40 Q164 36 170 40 Z" fill="#0f172a"/>
      <!-- Index Finger -->
      <path d="M174 30 L172 12 Q177 10 180 12 L180 30 Z" fill="#0f172a"/>
      <!-- Middle Finger -->
      <path d="M182 29 L184 8 Q189 8 191 10 L188 29 Z" fill="#0f172a"/>
      <!-- Ring Finger -->
      <path d="M190 32 L196 14 Q200 15 201 18 L194 33 Z" fill="#0f172a"/>
      <!-- Pinky Finger -->
      <path d="M193 38 L202 26 Q205 28 204 31 L196 42 Z" fill="#0f172a"/>
    </g>

    <!-- HEAD (Large Spherical Glossy White) -->
    <ellipse cx="100" cy="56" rx="50" ry="46" fill="url(#headGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Head Top Gloss Shine -->
    <ellipse cx="88" cy="24" rx="20" ry="8" fill="#ffffff" opacity="0.75" transform="rotate(-15 88 24)"/>

    <!-- VISOR SCREEN (Glossy Curved Black Screen) -->
    <rect x="62" y="24" width="76" height="60" rx="24" fill="url(#visorGrad)" stroke="#334155" stroke-width="2"/>
    <!-- Visor Glass Reflection Stripe -->
    <path d="M68 34 Q100 26 132 34 Q128 42 100 36 Q74 42 68 34 Z" fill="#ffffff" opacity="0.25"/>

    <!-- CYBER SCANLINES ON VISOR -->
    <line x1="68" y1="36" x2="132" y2="36" stroke="#1e293b" stroke-width="0.7" opacity="0.4"/>
    <line x1="68" y1="44" x2="132" y2="44" stroke="#1e293b" stroke-width="0.7" opacity="0.4"/>
    <line x1="68" y1="52" x2="132" y2="52" stroke="#1e293b" stroke-width="0.7" opacity="0.4"/>
    <line x1="68" y1="60" x2="132" y2="60" stroke="#1e293b" stroke-width="0.7" opacity="0.4"/>
    <line x1="68" y1="68" x2="132" y2="68" stroke="#1e293b" stroke-width="0.7" opacity="0.4"/>

    <!-- GLOWING CYAN LED EYES (Friendly Left Eye + Winking Right Eye) -->
    <!-- Left Eye (Big Circle Eye with Pupil & Sparkle) -->
    <g class="robot-eye-left" filter="url(#glow)">
      <circle cx="82" cy="50" r="10" fill="url(#cyanGlow)"/>
      <circle cx="82" cy="50" r="5.5" fill="#020617"/>
      <circle cx="85" cy="47" r="2.5" fill="#ffffff"/>
      <line x1="74" y1="50" x2="90" y2="50" stroke="#ffffff" stroke-width="0.8" opacity="0.7"/>
    </g>

    <!-- Right Eye (Playful Winking Arc / Chevron Eye) -->
    <g class="robot-eye-right" filter="url(#glow)">
      <path d="M110 52 Q118 42 126 50 Q118 46 110 52 Z" fill="url(#cyanGlow)"/>
      <path d="M109 52 L127 48" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>
      <circle cx="126" cy="48" r="2" fill="#ffffff"/>
    </g>

    <!-- GLOWING CHEERFUL CYAN LED SMILE -->
    <g filter="url(#glow)">
      <path d="M84 66 Q100 78 116 66 Q100 73 84 66 Z" fill="url(#cyanGlow)"/>
      <path d="M84 66 Q100 78 116 66" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <!-- Grid Teeth Glow lines -->
      <line x1="92" y1="68" x2="92" y2="72" stroke="#020617" stroke-width="1.2"/>
      <line x1="100" y1="69" x2="100" y2="73" stroke="#020617" stroke-width="1.2"/>
      <line x1="108" y1="68" x2="108" y2="72" stroke="#020617" stroke-width="1.2"/>
    </g>

  </g>
</svg>